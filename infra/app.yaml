AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Demeisen CRM v2 app: the API and migration functions, the web page's bucket and sign-in client. Holds no data:
  the database and backups are in the data stack (data/data.yaml), found through SSM parameters, so this stack can be
  redeployed, replaced or deleted without touching them. Behind the Demeisen front door the page is at /crm/; set
  Standalone=true and BasePath=/ to give the CRM its own CloudFront address instead (for a copy shared on its own).

Parameters:
  BasePath: { Type: String, Default: /crm/, AllowedPattern: '^/([a-z0-9-]+/)?$', Description: '/crm/ behind the front door, / standalone' }
  Standalone: { Type: String, AllowedValues: ['false', 'true'], Default: 'false' }
  FrontDoorOrigin: { Type: 'AWS::SSM::Parameter::Value<String>', Default: /demeisen/v2/edge/origin, Description: 'e.g. https://d123.cloudfront.net (no trailing slash)' }
  FrontDoorDistributionArn: { Type: 'AWS::SSM::Parameter::Value<String>', Default: /demeisen/v2/edge/distribution-arn }
  UserPoolId: { Type: 'AWS::SSM::Parameter::Value<String>', Default: /demeisen/v2/auth/user-pool-id }
  DbHost: { Type: 'AWS::SSM::Parameter::Value<String>', Default: /demeisen/v2/crm/db/host }
  DbResourceId: { Type: 'AWS::SSM::Parameter::Value<String>', Default: /demeisen/v2/crm/db/resource-id }
  DbMasterSecretArn: { Type: 'AWS::SSM::Parameter::Value<String>', Default: /demeisen/v2/crm/db/master-secret-arn }
  SubnetIds: { Type: 'AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>', Default: /demeisen/v2/crm/net/subnets }
  ClientSecurityGroup: { Type: 'AWS::SSM::Parameter::Value<AWS::EC2::SecurityGroup::Id>', Default: /demeisen/v2/crm/net/client-sg }
  BackupBucket: { Type: 'AWS::SSM::Parameter::Value<String>', Default: /demeisen/v2/crm/backup-bucket }
  AlertTopic: { Type: 'AWS::SSM::Parameter::Value<String>', Default: /demeisen/v2/crm/alert-topic }
  # The Azure front door's address (e.g. https://x.azurefd.net), or none: lets this sign-in client return there too
  # while v2 runs on both clouds (SSM /demeisen/v2/azure/url).
  AzureUrl: { Type: 'AWS::SSM::Parameter::Value<String>', Default: /demeisen/v2/azure/url }

Conditions:
  HasAzure: !Not [!Equals [!Ref AzureUrl, none]]
  IsStandalone: !Equals [!Ref Standalone, 'true']
  HasFrontDoor: !Not [!Equals [!Ref FrontDoorDistributionArn, none]]
  HasReader: !Or [!Condition IsStandalone, !Condition HasFrontDoor]

Resources:
  # ---------- Sign-in client (browser, public, PKCE) ----------
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: demeisen-v2-crm-web
      UserPoolId: !Ref UserPoolId
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs: !If
        - HasAzure
        - [!If [IsStandalone, !Sub 'https://${Distribution.DomainName}${BasePath}', !Sub '${FrontDoorOrigin}${BasePath}'], !Sub '${AzureUrl}${BasePath}']
        - [!If [IsStandalone, !Sub 'https://${Distribution.DomainName}${BasePath}', !Sub '${FrontDoorOrigin}${BasePath}']]
      LogoutURLs: !If
        - HasAzure
        - [!If [IsStandalone, !Sub 'https://${Distribution.DomainName}${BasePath}', !Sub '${FrontDoorOrigin}${BasePath}'], !Sub '${AzureUrl}${BasePath}']
        - [!If [IsStandalone, !Sub 'https://${Distribution.DomainName}${BasePath}', !Sub '${FrontDoorOrigin}${BasePath}']]
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 8
      AccessTokenValidity: 8
      TokenValidityUnits: { IdToken: hours, AccessToken: hours }

  # ---------- API function: signs in to MySQL as crm_app with a short-lived IAM token, no stored password ----------
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: 'sts:AssumeRole' }]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole']
      Policies:
        - PolicyName: database-and-backup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: 'rds-db:connect', Resource: !Sub 'arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/crm_app' }
              - { Effect: Allow, Action: 's3:PutObject', Resource: !Sub 'arn:aws:s3:::${BackupBucket}/*' }
  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: demeisen-v2-crm-api
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/index.handler
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt FunctionRole.Arn
      # Placeholder: the Deploy workflow uploads the code straight after the stack is created or updated.
      Code: { ZipFile: "exports.handler = async () => ({ statusCode: 503, body: 'Not deployed yet' });" }
      VpcConfig: { SecurityGroupIds: [!Ref ClientSecurityGroup], SubnetIds: !Ref SubnetIds }
      Environment: { Variables: { DB_HOST: !Ref DbHost, DB_USER: crm_app, BACKUP_BUCKET: !Ref BackupBucket } }
  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/demeisen-v2-crm-api, RetentionInDays: 90 }

  # ---------- Migration function: no public address; invoked by the Deploy workflow and ops scripts only ----------
  MigrateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: 'sts:AssumeRole' }]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole']
      Policies:
        - PolicyName: migrate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: 'rds-db:connect', Resource: !Sub 'arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/crm_migrator' }
              - { Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref DbMasterSecretArn }
  MigrateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: demeisen-v2-crm-migrate
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/migrate.handler
      MemorySize: 512
      Timeout: 600
      Role: !GetAtt MigrateRole.Arn
      Code: { ZipFile: "exports.handler = async () => { throw new Error('Not deployed yet'); };" }
      VpcConfig: { SecurityGroupIds: [!Ref ClientSecurityGroup], SubnetIds: !Ref SubnetIds }
      Environment: { Variables: { DB_HOST: !Ref DbHost, MASTER_SECRET_ARN: !Ref DbMasterSecretArn } }
  MigrateLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/demeisen-v2-crm-migrate, RetentionInDays: 365 }

  # ---------- HTTP API with the sign-in check ----------
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties: { Name: demeisen-v2-crm, ProtocolType: HTTP }
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings: { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }
  ApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties: { ApiId: !Ref Api, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt Function.Arn, PayloadFormatVersion: '2.0' }
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: !Sub 'ANY ${BasePath}api/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*'

  # ---------- Web page (code, not data: rebuilt from the repo on every deploy) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasReader
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !If [IsStandalone, !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}', !Ref FrontDoorDistributionArn]

  # ---------- Own address, only for a standalone copy ----------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: IsStandalone
    Properties:
      OriginAccessControlConfig: { Name: demeisen-v2-crm-standalone, OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4 }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: IsStandalone
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: demeisen-v2-crm standalone
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - { Id: site, DomainName: !GetAtt SiteBucket.RegionalDomainName, OriginAccessControlId: !Ref OriginAccessControl, S3OriginConfig: { OriginAccessIdentity: '' } }
          - { Id: api, DomainName: !Sub '${Api}.execute-api.${AWS::Region}.amazonaws.com', CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] } }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader

  # ---------- Nightly export of every table, and alerts ----------
  BackupSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: demeisen-v2-crm-nightly-export
      ScheduleExpression: cron(0 2 * * ? *)
      ScheduleExpressionTimezone: Europe/London
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt Function.Arn
        RoleArn: !GetAtt BackupScheduleRole.Arn
        Input: '{"backup":true}'
        RetryPolicy: { MaximumRetryAttempts: 2 }
  BackupScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: scheduler.amazonaws.com }, Action: 'sts:AssumeRole', Condition: { StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } } }
      Policies:
        - PolicyName: invoke-function
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{ Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !GetAtt Function.Arn }]
  BackupCompletedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FunctionLogs
      FilterPattern: '"backup complete"'
      MetricTransformations: [{ MetricNamespace: DemeisenV2CRM, MetricName: BackupCompleted, MetricValue: '1', DefaultValue: 0 }]
  BackupMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: demeisen-v2-crm-export-missing
      AlarmDescription: No CRM nightly export completed in the last day
      Namespace: DemeisenV2CRM
      MetricName: BackupCompleted
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
  FunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: demeisen-v2-crm-function-errors
      AlarmDescription: The CRM function failed, which includes a failed export
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Function }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ---------- Where the front door and the Deploy workflow find things ----------
  SsmSiteBucket: { Type: AWS::SSM::Parameter, Properties: { Name: /demeisen/v2/crm/site/bucket, Type: String, Value: !Ref SiteBucket } }
  SsmSiteDomain: { Type: AWS::SSM::Parameter, Properties: { Name: /demeisen/v2/crm/site/bucket-domain, Type: String, Value: !GetAtt SiteBucket.RegionalDomainName } }
  SsmApiDomain: { Type: AWS::SSM::Parameter, Properties: { Name: /demeisen/v2/crm/api/domain, Type: String, Value: !Sub '${Api}.execute-api.${AWS::Region}.amazonaws.com' } }
  SsmClientId: { Type: AWS::SSM::Parameter, Properties: { Name: /demeisen/v2/crm/client-id, Type: String, Value: !Ref UserPoolClient } }
  SsmBasePath: { Type: AWS::SSM::Parameter, Properties: { Name: /demeisen/v2/crm/base-path, Type: String, Value: !Ref BasePath } }

Outputs:
  FunctionName: { Value: !Ref Function }
  MigrateFunctionName: { Value: !Ref MigrateFunction }
  SiteBucketName: { Value: !Ref SiteBucket }
  ClientId: { Value: !Ref UserPoolClient }
  StandaloneUrl: { Condition: IsStandalone, Value: !Sub 'https://${Distribution.DomainName}/' }
