   const auth = DemeisenAuth({ authDomain: 'x.auth.eu-west-2.amazoncognito.com', clientId: '...' });
   await auth.finishSignIn();            // on page load: completes a sign-in redirect if there is one
   if (!auth.idToken()) auth.signIn();   // send the person to the sign-in page
   fetch('/api', { headers: { authorization: 'Bearer ' + auth.idToken() } });
   auth.signOut();

   redirectUri (default: site root), and for non-Cognito providers authorizeUrl / tokenUrl / logoutUrl. */
(function (root) {

  const randomStr = () => b64url(crypto.getRandomValues(new Uint8Array(32)));

    }

    async function signIn() {
      const verifier = randomStr(), state = randomStr();
      sessionStorage.setItem(pkceKey, JSON.stringify({ verifier, state, hash: location.hash }));

        redirect_uri: redirectUri(), scope, state, code_challenge_method: 'S256', code_challenge: challenge }));

    // (e.g. a different version of the page started it), starts sign-in once more instead of failing; throws only
    // if that happens twice in a row.

<script>
const KEY = 'demeisen-crm-proforma-v2';
// config.js exists only on the hosted site. Without it, the page runs on browser storage as before.
const CFG = window.CRM_CONFIG || null, LIVE = !!CFG;
// Where the CRM lives on the site: '/' when it has its own address, '/crm/' behind the Demeisen front door.
const BASE = ((CFG && CFG.basePath) || '/').replace(/\/?$/, '/');
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const iso = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
const rel = n => { const x = new Date(TODAY); x.setDate(x.getDate() + n); return iso(x); };
const daysFrom = s => Math.round((new Date(s + 'T00:00') - TODAY) / 864e5);
const fmt = s => s ? new Date(s + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function seed() {

    ],
    people: [

      { id: 2, name: 'Jo Marsh', email: 'jo.marsh@example.org', companyId: 2, title: '', phone: '' },
      { id: 3, name: 'Alex Staff', email: 'alex.staff@example.net', companyId: 4, title: '', phone: '' },
      { id: 4, name: 'Chris Staff', email: 'chris.staff@example.net', companyId: 4, title: '', phone: '' },
      { id: 5, name: 'Pat Lane', email: 'pat.lane@example.com', companyId: 3, title: '', phone: '' }
    ],
    interactions: [
      { id: 1, type: 'Interaction', date: rel(-21), companyId: 1, recordedBy: 3, people: [3, 4, 1],
        desc: 'Intro meeting with the Northgate external manager team. Walked through strategy, capacity and track record.',
        next: 'Send DDQ and monthly letters. Follow up on SMA terms.' },
      { id: 2, type: 'Interaction', date: rel(-14), companyId: 3, recordedBy: 3, people: [3, 5],
        desc: 'Catch-up with Example Prime Bank cap intro on upcoming investor events.',

}

const DEFAULT_STAGES = ['Current Investor (CF)', 'Current Investor (SMA)', 'Onboarding (DD)', 'Active Progress', 'Target Investor', 'In Process',
  'Keen, Catalyst Needed', 'Distribution List', 'Met, Connected', 'Not Interested Currently', 'Not connected', 'N/A - Other'];
const NO_STAGE = 'N/A - Other';
// The live list comes from the material_type table; this copy is for browser-only data.
const DEFAULT_MATERIALS = ['Marketing deck', 'Sample portfolio', 'Performance / P&L summary', 'References', 'MNDA', 'AIMA DDQ', 'Bilateral DDQ',
  'Background checks', 'IMA (if SMA)'];
function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
// Every edit counts as an unsaved change until the workbook is saved; import, export and reset pass false.
function save(changed = true) {
  if (LIVE) return true; // the database is the store; writes go through api()
  if (changed) { db.meta = db.meta || { source: '', loadedAt: new Date().toISOString(), warnings: [] }; db.meta.changes = (db.meta.changes || 0) + 1; }
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { return false; }
  if (typeof renderStatus === 'function') renderStatus();
  return true;
}
let db = LIVE ? { companies: [], people: [], interactions: [], actions: [], pairings: [] } : (load() || seed());

db.companies.forEach(c => { if (!c.stage) c.stage = NO_STAGE; }); // browser data saved before engagement stages existed

/* ---------- Hosted site: sign-in (authorization code with PKCE) and API calls ---------- */
// Sign-in uses the shared Demeisen Auth module (inlined above). The storage keys are the CRM's original ones, so tabs
// signed in before an update stay signed in and a cached older page can still complete a sign-in.
const AUTH = LIVE ? DemeisenAuth({ authDomain: CFG.authDomain, clientId: CFG.clientId, authorizeUrl: CFG.authorizeUrl, tokenUrl: CFG.tokenUrl, logoutUrl: CFG.logoutUrl, storageKey: 'crm-id-token', pkceKey: 'crm-pkce', redirectUri: location.origin + BASE }) : null;
const idToken = () => AUTH.idToken(), signIn = () => AUTH.signIn(), finishSignIn = () => AUTH.finishSignIn(), signOut = () => AUTH.signOut();
const claims = t => AUTH.claims(t);
async function api(method, path, body) {
  const t = idToken();
  if (!t) { await signIn(); throw new Error('Signing in again.'); }
  const r = await fetch(BASE + path.replace(/^\//, ''), { method, headers: { authorization: `Bearer ${t}`, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { AUTH.forget(); await signIn(); throw new Error('Signing in again.'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || 'That could not be saved.'); e.status = r.status; throw e; }
  return data;
}
async function reloadData() { db = await api('GET', '/api/data'); }
// Runs a write. On a conflict, loads the latest data so the person sees what changed.
async function liveWrite(fn, errEl) {
  try { return await fn(); }
  catch (e) {
    if (errEl) errEl.textContent = e.message; else toast(e.message);
    if (e.status === 409) { await reloadData().catch(() => {}); if (!errEl) route(); }
    return null;
  }
}

const byId = (arr, id) => arr.find(x => x.id === id);
const company = id => byId(db.companies, id);

const tcls = t => ({ 'Investor': 'inv', 'Consultant': 'inv', 'Prime CI': 'ci', 'Third Party Marketer': 'ci', 'Prior Colleague': 'ci', 'Friendly LP': 'ci', 'Demeisen': 'dem', 'Other': 'oth' }[t] || 'ixn');

const materialTypes = () => (db.materialTypes && db.materialTypes.length ? db.materialTypes : DEFAULT_MATERIALS);
const stageOpts = (sel, placeholder) => (placeholder ? `<option value="" disabled ${sel ? '' : 'selected'}>${placeholder}</option>` : '')
  + stages().map(t => `<option ${t === sel ? 'selected' : ''}>${esc(t)}</option>`).join('');
const coPill = co => co ? `<button type="button" class="pill ${tcls(co.type)}" data-filter-co="${co.id}" title="Open ${esc(co.name)} one-pager">${esc(co.name)}</button>` : '';
const typePill = t => `<span class="pill ${t === 'Intel' ? 'intel' : 'ixn'}">${t}</span>`;
const ownerOpts = sel => demeisenPeople().map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
const companyOpts = (sel, { excludeDemeisen = true } = {}) => COMPANY_TYPES
  .filter(t => !(excludeDemeisen && t === 'Demeisen'))
  .map(t => {
    const cs = db.companies.filter(c => c.type === t).sort((a, b) => a.name.localeCompare(b.name));

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);

/* ---------- Routing ---------- */
const VIEWS = { home: renderHome, todo: renderTodo, interactions: renderInteractions, allocator: renderAllocator, current: () => renderStagePage('current'), targeted: () => renderStagePage('targeted'), finder: renderFinder, capintro: renderCapIntro, cilead: renderCiLead, pairings: renderPairings, log: renderLog, search: renderSearch, companies: renderCompanies, people: renderPeople, settings: () => { view.innerHTML = ''; } };
const view = document.getElementById('view');
function route() {
  let v = location.hash.slice(1);
  if (!VIEWS[v]) v = 'home';
  document.querySelectorAll('nav.tabs a, header.top .top-log').forEach(a => { if (a.dataset.view === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.querySelectorAll('nav.tabs .menu').forEach(m => { m.open = false; m.classList.toggle('has-current', !!m.querySelector(`a[data-view="${v}"]`)); });
  document.getElementById('settings-pane').style.display = v === 'settings' ? '' : 'none';
  VIEWS[v]();
}
// The Static Data menu closes on a click elsewhere, on Escape, or when a page is chosen (see route).
document.addEventListener('click', e => { document.querySelectorAll('nav.tabs .menu[open]').forEach(m => { if (!m.contains(e.target) || e.target.closest('.menu-list a')) m.open = false; }); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('nav.tabs .menu[open]').forEach(m => { m.open = false; m.querySelector('summary').focus(); }); });
function goto(v) { if (location.hash.slice(1) === v) route(); else location.hash = v; window.scrollTo(0, 0); }
window.addEventListener('hashchange', () => { if (LIVE && !idToken()) return; route(); window.scrollTo(0, 0); });

/* ---------- To-do ---------- */
let todoOwner = 'all', showDone = false;
function bucket(a) {
  if (!a.due) return 'nodate';
  const d = daysFrom(a.due);
  return d < 0 ? 'overdue' : d <= 7 ? 'week' : 'later';
}
function dueLabel(a) {
  if (!a.due) return 'No date';
  const d = daysFrom(a.due);
  if (a.status !== 'Open') return fmt(a.due);
  if (d < 0) return `${-d} day${d === -1 ? '' : 's'} overdue`;
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d <= 7) return `In ${d} days`;
  return fmt(a.due);
}
function actionRow(a) {
  const it = a.interactionId ? byId(db.interactions, a.interactionId) : null;
  const co = it && it.companyId ? company(it.companyId) : null;
  const owner = person(a.ownerId);
  return `<li class="act ${a.status !== 'Open' ? 'is-done' : ''}">
    <input type="checkbox" id="act-${a.id}" data-act="${a.id}" ${a.status === 'Done' ? 'checked' : ''} aria-label="Mark ${esc(a.desc)} done">
    <div><label for="act-${a.id}" class="act-desc">${esc(a.desc)}</label>
      <div class="meta">${coPill(co)}<span>${esc(owner ? owner.name : 'Unassigned')}</span>
      ${it ? `<button type="button" class="linkbtn" data-open-int="${it.id}">From ${it.type.toLowerCase()}, ${fmt(it.date)}</button>` : '<span>Standalone action</span>'}</div>
    </div>
    <div class="due ${a.status === 'Open' ? bucket(a) : ''}">${dueLabel(a)}</div>
  </li>`;
}
function renderTodo() {
  const mine = db.actions.filter(a => todoOwner === 'all' || a.ownerId === +todoOwner);
  const open = mine.filter(a => a.status === 'Open');
  const sortDue = (a, b) => (a.due || '9999').localeCompare(b.due || '9999');
  const groups = { overdue: [], week: [], later: [], nodate: [] };
  open.forEach(a => groups[bucket(a)].push(a));
  Object.values(groups).forEach(g => g.sort(sortDue));
  const done = mine.filter(a => a.status !== 'Open').sort((a, b) => sortDue(b, a));
  const labels = { overdue: 'Overdue', week: 'Due in next 7 days', later: 'Later', nodate: 'No due date' };
  const recent = [...db.interactions].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 6);

  view.innerHTML = `
    <div class="pagehead">
      <div><h1>To-do</h1><p class="sub">Open actions from interactions and intel. Tick an action to mark it done.</p></div>
      <div class="toolbar">
        <label class="lbl" for="td-owner">Owner</label>
        <select id="td-owner"><option value="all">Everyone</option>${ownerOpts(+todoOwner)}</select>
      </div>
    </div>
    <div class="todo-grid">
      <div class="stack">
        <div class="tiles">
          ${['overdue', 'week', 'later', 'nodate'].map(k => `<a class="panel tile ${k === 'overdue' && groups[k].length ? 'crit' : k === 'week' && groups[k].length ? 'warn' : ''}" href="#todo" data-jump="grp-${k}">
            <span class="n">${groups[k].length}</span><span class="lbl">${labels[k]}</span></a>`).join('')}
        </div>
        <form class="panel quickadd" id="qa">
          <input type="text" id="qa-desc" placeholder="Add a standalone action, e.g. Chase signed NDA" aria-label="New action">
          <select id="qa-owner" aria-label="Owner">${ownerOpts(todoOwner === 'all' ? demeisenPeople()[0]?.id : +todoOwner)}</select>
          <input type="date" id="qa-due" aria-label="Due date">
          <button class="btn" type="submit">Add action</button>
        </form>
        ${['overdue', 'week', 'later', 'nodate'].map(k => `
          <section class="group" id="grp-${k}">
            <h2>${labels[k]} <span class="mono">${groups[k].length}</span></h2>
            <div class="panel">${groups[k].length ? `<ul class="acts">${groups[k].map(actionRow).join('')}</ul>` : `<div class="empty">Nothing here.</div>`}</div>
          </section>`).join('')}
        <section class="group">
          <h2>Completed <span class="mono">${done.length}</span> <button type="button" class="linkbtn" id="td-toggle-done" style="text-transform:none;letter-spacing:0;font-weight:400">${showDone ? 'Hide' : 'Show'}</button></h2>
          ${showDone ? `<div class="panel">${done.length ? `<ul class="acts">${done.map(actionRow).join('')}</ul>` : `<div class="empty">No completed actions yet.</div>`}</div>` : ''}
        </section>
      </div>
      <aside class="panel">
        <div class="rail-head"><h2>Recent interactions &amp; intel</h2></div>
        <ul class="feed">${recent.map(it => {
          const co = it.companyId ? company(it.companyId) : null;
          return `<li><button type="button" class="open-int" data-open-int="${it.id}">
            <span class="row"><span class="mono muted">${fmt(it.date)}</span>${typePill(it.type)}${co ? `<span class="pill ${tcls(co.type)}">${esc(co.name)}</span>` : '<span class="muted">General</span>'}</span>
            <span class="txt">${esc(it.desc)}</span></button></li>`;
        }).join('')}</ul>
        <div class="rail-head" style="border-top:1px solid var(--line);border-bottom:0"><a href="#log" class="btn ghost sm">Log interaction / intel</a></div>
      </aside>
    </div>`;

  view.querySelector('#td-owner').addEventListener('change', e => { todoOwner = e.target.value; renderTodo(); });
  view.querySelector('#td-toggle-done').addEventListener('click', () => { showDone = !showDone; renderTodo(); });
  view.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  view.querySelector('#qa').addEventListener('submit', e => {
    e.preventDefault();
    const desc = view.querySelector('#qa-desc').value.trim();
    if (!desc) { view.querySelector('#qa-desc').focus(); toast('Type the action first.'); return; }
    if (LIVE) {
      liveWrite(async () => {
        await api('POST', '/api/actions', { desc, ownerId: +view.querySelector('#qa-owner').value, due: view.querySelector('#qa-due').value });
        await reloadData(); renderTodo(); toast('Action added');
      });
      return;
    }
    db.actions.push({ id: nextId(db.actions), desc, ownerId: +view.querySelector('#qa-owner').value, due: view.querySelector('#qa-due').value, interactionId: null, status: 'Open' });
    save(); renderTodo(); toast('Action added');
  });
}

let logPrefill = null, logEdit = null;

  if (extra.length) groups.push(['Also on this entry', extra]);
  return groups.map(([g, ps], gi) => `<div class="pgroup"><span class="lbl">${esc(g)}</span><div class="chips">${
    ps.map(p => `<label class="chk"><input type="checkbox" name="lg-person" value="${p.id}" ${checked.includes(p.id) ? 'checked' : ''}>${esc(p.name)}</label>`).join('')}${
    !ps.length && !(coId && gi === 1) ? `<span class="muted">No people recorded for ${esc(g)} yet.</span>` : ''}${
    coId && gi === 1 ? `<button type="button" class="chk add-chip" data-add-person="${coId}">+ Add a contact</button>` : ''}</div>${
    coId && gi === 1 ? `<div class="add-person" hidden>
      <input type="text" class="ap-name" placeholder="Name" aria-label="New contact's name" maxlength="200">
      <input type="text" class="ap-title" placeholder="Job title (optional)" aria-label="New contact's job title" maxlength="100">

const FORMATS = ['Meeting', 'Call', 'Coffee', 'Drink', 'Email', 'Messaging', 'Intro', 'Conference', 'Event', 'Feedback', 'Other'];
// One tick box per material; when ticked, the date shared and an optional version (suggesting versions used before).
function matRow(m, k, ed) {
  const rec = ed?.materials?.find(x => x.name === m);
  const versions = [...new Set(db.interactions.flatMap(i => (i.materials || []).filter(x => x.name === m && x.version).map(x => x.version)))].sort();
  return `<div class="mat-row">
    <label class="chk"><input type="checkbox" class="m-on" data-mat="${esc(m)}" ${rec ? 'checked' : ''}> ${esc(m)}</label>
    <input type="date" class="m-date" value="${esc(rec?.date || '')}" aria-label="Date ${esc(m)} shared" ${rec ? '' : 'hidden'}>
    <input type="text" class="m-ver" list="m-ver-${k}" value="${esc(rec?.version || '')}" placeholder="Version (optional)" aria-label="${esc(m)} version" ${rec ? '' : 'hidden'}>
    <datalist id="m-ver-${k}">${versions.map(v => `<option value="${esc(v)}">`).join('')}</datalist></div>`;
}

        <div class="field"><label class="lbl" for="lg-by">Recorded by</label><select id="lg-by"><option value="">Unknown</option>${ownerOpts(by)}</select></div>

  const f = view.querySelector('#lg');

    if (LIVE) {
      const actions = [...f.querySelectorAll('.arow')].map(r => ({ id: +r.dataset.aid || null, desc: r.querySelector('.a-desc').value.trim(), ownerId: +r.querySelector('.a-owner').value || null, due: r.querySelector('.a-due').value })).filter(a => a.desc);
      const payload = { type, date, companyId, recordedBy: +f.querySelector('#lg-by').value || null, people: checkedPeople(),
        format: type === 'Interaction' ? f.querySelector('#lg-kind').value : (ed?.format || 'Feedback'), viaId: +f.querySelector('#lg-via').value || null,

      const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; err.textContent = '';
      liveWrite(async () => {
        const res = await api(ed ? 'PUT' : 'POST', ed ? `/api/interactions/${ed.id}` : '/api/interactions', payload);
        await reloadData();
        toast(ed ? 'Entry updated' : `${type} saved`);
        openInteraction(res.id);
      }, err).finally(() => { btn.disabled = false; });
      return;
    }
    const id = ed ? ed.id : nextId(db.interactions);
    const entry = { id, type, date, companyId, recordedBy: +f.querySelector('#lg-by').value || null, people: checkedPeople(),
      format: type === 'Interaction' ? f.querySelector('#lg-kind').value : (ed?.format || 'Feedback'), viaId: +f.querySelector('#lg-via').value || null,
      desc, next: f.querySelector('#lg-next').value.trim(), materials: type === 'Interaction' ? sharedMaterials(date) : [], review: ed ? ed.review : '', updated: new Date().toISOString() };
    if (ed) Object.assign(ed, entry); else db.interactions.push(entry);
    // Rows that came from existing actions update them; removed rows delete them; blank rows are ignored.
    const kept = new Set();
    let n = 0;
    f.querySelectorAll('.arow').forEach(r => {
      const d = r.querySelector('.a-desc').value.trim();
      if (!d) return;
      const fields = { desc: d, ownerId: +r.querySelector('.a-owner').value || null, due: r.querySelector('.a-due').value };
      const old = r.dataset.aid && byId(db.actions, +r.dataset.aid);
      if (old) { Object.assign(old, fields); kept.add(old.id); }
      else { db.actions.push({ id: nextId(db.actions), ...fields, interactionId: id, status: 'Open' }); n++; }
    });
    const dropped = edActs.filter(a => !kept.has(a.id));
    if (dropped.length) db.actions = db.actions.filter(a => !dropped.includes(a));
    save();
    toast(ed ? 'Entry updated' : `${type} saved${n ? ` with ${n} action${n > 1 ? 's' : ''}` : ''}`);
    openInteraction(id);
  });
}

// Entries per month, from the first entry to this month (up to 24 months). its is sorted newest first.
function activityPanel(its) {
  const first = its[its.length - 1];
  const months = [];
  if (first?.date) {
    const d = new Date(first.date.slice(0, 7) + '-01T00:00'), end = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    while (d <= end && months.length < 24) { months.push(iso(d).slice(0, 7)); d.setMonth(d.getMonth() + 1); }
  }
  if (!months.length) return '';
  const perMonth = months.map(m => its.filter(i => i.date.startsWith(m)).length);
  const maxM = Math.max(1, ...perMonth);
  return `<section class="panel"><div class="sec-head"><h2>Activity by month</h2></div>
    <div class="months">${months.map((m, k) => `<div class="month"><span class="cnt">${perMonth[k]}</span>
      <div class="barwrap"><div class="bar ${perMonth[k] ? '' : 'zero'}" style="height:${perMonth[k] ? Math.max(4, perMonth[k] / maxM * 100) : 4}%"></div></div>
      <span class="m">${new Date(m + '-01T00:00').toLocaleDateString('en-GB', { month: 'short' })}</span></div>`).join('')}</div></section>`;
}

const STAGE_PAGES = {
  current: { title: 'Current Investors', sub: 'Current investors in the comingled fund and SMAs, each with its open to-dos and latest interactions, most recently contacted first.',
    groups: [['Current Investor (CF)', [1]], ['Current Investor (SMA)', [2]]] },

    groups: [['Process', [3, 4]], ['Focus', [5, 6]], ['Catalyst needed', [7]], ['Distribution list', [8]], ['Other', [9, 10, 11, 12]]], unclassified: 'Other' }
};
const stageOpen = {};
function renderStagePage(key) {
  const cfg = STAGE_PAGES[key], st = stages();
  const groups = cfg.groups.map(([name, nums]) => ({ name, nums, stages: nums.map(n => st[n - 1]).filter(Boolean), rows: [] }));
  db.companies.filter(c => ALLOCATOR_TYPES.includes(c.type)).forEach(c => {
    const n = st.indexOf(c.stage) + 1;
    const g = groups.find(x => x.nums.includes(n)) || (n ? null : groups.find(x => x.name === cfg.unclassified));
    if (!g) return;
    const its = db.interactions.filter(i => i.companyId === c.id).sort(byRecent);
    const ids = new Set(its.map(i => i.id));
    g.rows.push({ c, its, todo: db.actions.filter(a => a.status === 'Open' && ids.has(a.interactionId)).sort(byDue), last: its[0]?.date || '' });
  });
  groups.forEach(g => g.rows.sort((a, b) => b.last.localeCompare(a.last) || a.c.name.localeCompare(b.c.name)));
  if (!stageOpen[key]) stageOpen[key] = new Set(groups.filter(g => g.name !== 'Other').map(g => g.name)); // Other starts collapsed
  const open = stageOpen[key];
  const all = groups.flatMap(g => g.rows), todos = all.flatMap(r => r.todo);
  const gid = g => 'stg-' + g.name.replace(/\W/g, '');
  const tiles = groups.filter(g => g.name !== 'Other').map(g => `<a class="panel tile" href="#${gid(g)}" data-tgt-jump="${esc(g.name)}"><span class="n">${g.rows.length}</span><span class="lbl">${esc(g.name)}</span><span class="small">${g.rows.reduce((n, r) => n + r.todo.length, 0)} open to-dos</span></a>`);
  if (tiles.length < 4) tiles.push(`<div class="panel tile"><span class="n">${todos.length}</span><span class="lbl">Open to-dos</span><span class="small">${(n => `Across ${n} investor${n === 1 ? '' : 's'}`)(all.filter(r => r.todo.length).length)}</span></div>`);
  if (tiles.length < 4) { const od = todos.filter(a => bucket(a) === 'overdue').length; tiles.push(`<div class="panel tile ${od ? 'crit' : ''}"><span class="n">${od}</span><span class="lbl">Overdue</span><span class="small">${todos.filter(a => bucket(a) === 'week').length} due in next 7 days</span></div>`); }
  const todoList = r => r.todo.length ? `<ul class="tgt-list">${r.todo.slice(0, 4).map(a => `<li><span class="mono ${bucket(a) === 'overdue' ? 'over' : ''}">${a.due ? fmt(a.due) : 'No date'}</span><span class="txt">${esc(a.desc)}${person(a.ownerId) ? ` <span class="muted">· ${esc(person(a.ownerId).name)}</span>` : ''}</span></li>`).join('')}
    ${r.todo.length > 4 ? `<li class="muted">and ${r.todo.length - 4} more</li>` : ''}</ul>` : '<span class="muted">None open</span>';
  const ixList = r => r.its.length ? `<ul class="tgt-list">${r.its.slice(0, 3).map(i => `<li><span class="mono">${fmt(i.date)}</span><a href="#" class="txt" data-open-int="${i.id}">${i.format ? esc(i.format) + ': ' : ''}${esc(i.desc)}</a></li>`).join('')}</ul>` : '<span class="muted">No interactions yet</span>';
  view.innerHTML = `
    <div class="pagehead"><div><h1>${cfg.title}</h1><p class="sub">${cfg.sub} Set a stage here or on the one-pager; it saves straight away.</p></div></div>
    <div class="stack">

function finderRows() {
  const st = stages();
  const groups = Object.fromEntries([['Current', [1, 2]], ...STAGE_PAGES.targeted.groups]);
  const terms = fs.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = db.companies.filter(c => ALLOCATOR_TYPES.includes(c.type)).map(c => {
    const its = db.interactions.filter(i => i.companyId === c.id).sort(byRecent);
    const ids = new Set(its.map(i => i.id));
    const todo = db.actions.filter(a => a.status === 'Open' && ids.has(a.interactionId));
    const leads = ciLeads(c.id);
    const people = db.people.filter(p => p.companyId === c.id);
    return { c, its, last: its[0], todo, overdue: todo.filter(a => bucket(a) === 'overdue').length, leads, n: st.indexOf(c.stage) + 1,
      text: [c.name, c.notes, c.investorType, c.investmentType, c.stage, ...people.map(p => `${p.name} ${p.title || ''} ${p.email || ''}`)].join(' ').toLowerCase() };
  }).filter(r => {
    if (terms.some(t => !r.text.includes(t))) return false;
    if (fs.stage.startsWith('g:')) { const nums = groups[fs.stage.slice(2)] || []; if (!(nums.includes(r.n) || (fs.stage === 'g:Other' && !r.n))) return false; }
    if (fs.stage.startsWith('s:') && r.c.stage !== fs.stage.slice(2)) return false;
    if (fs.type && r.c.type !== fs.type) return false;
    if (fs.invType && r.c.investorType !== fs.invType) return false;
    const ago = r.last ? -daysFrom(r.last.date) : null;
    if (fs.contact === 'never' && r.last) return false;
    if (['30', '90'].includes(fs.contact) && (ago === null || ago > +fs.contact)) return false;
    if (fs.contact === 'over90' && (ago === null || ago <= 90)) return false;
    if (fs.contact === 'over180' && (ago === null || ago <= 180)) return false;
    if (fs.introducer === 'none' && r.leads.length) return false;
    if (fs.introducer && fs.introducer !== 'none' && !r.leads.some(l => l.ciId === +fs.introducer)) return false;
    if (fs.todo === 'yes' && !r.todo.length) return false;
    if (fs.todo === 'overdue' && !r.overdue) return false;
    if (fs.todo === 'no' && r.todo.length) return false;
    return true;
  });
  const lastDate = r => r.last?.date || '';
  const byName = (a, b) => a.c.name.localeCompare(b.c.name);
  const sorts = {
    recent: (a, b) => lastDate(b).localeCompare(lastDate(a)) || byName(a, b),
    stale: (a, b) => (lastDate(a) || '0').localeCompare(lastDate(b) || '0') || byName(a, b),
    name: byName,
    stage: (a, b) => (a.n || 99) - (b.n || 99) || lastDate(b).localeCompare(lastDate(a)) || byName(a, b),
    entries: (a, b) => b.its.length - a.its.length || byName(a, b),
    todos: (a, b) => b.todo.length - a.todo.length || b.overdue - a.overdue || byName(a, b)
  };
  return rows.sort(sorts[fs.sort] || sorts.recent);
}

function downloadFinderCsv() {
  const q = v => { const t = String(v ?? ''); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const head = ['Allocator', 'Company Type', 'Investor Type', 'Investment Type', 'Engagement Stage', 'Introducer', 'Entries', 'Open To-dos', 'Overdue', 'Last Interaction', 'Last Format', 'Last Description'];
  const lines = finderRows().map(r => [r.c.name, r.c.type, r.c.investorType, r.c.investmentType, r.c.stage, r.leads.map(l => company(l.ciId)?.name).filter(Boolean).join('; '),
    r.its.length, r.todo.length, r.overdue, r.last?.date || '', r.last?.format || '', r.last?.desc || ''].map(q).join(','));
  const blob = new Blob(['﻿' + [head.join(','), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `Demeisen allocators ${iso(new Date())}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Material shared across a set of entries: ticked items, plus items picked up from the notes of
// entries with nothing ticked. One row per item, in list order, with the latest share.
function materialShared(its) {
  const all = [];
  its.filter(i => i.type === 'Interaction').forEach(i => {
    if (i.materials && i.materials.length) i.materials.forEach(m => all.push({ name: m.name, date: m.date, version: m.version || '', ixId: i.id, notes: false }));
    else SHARE_TYPES.forEach(([name, re]) => { if (re.test(`${i.desc} ${i.next}`)) all.push({ name, date: i.date, version: '', ixId: i.id, notes: true }); });
  });
  const order = materialTypes();
  const names = [...new Set(all.map(x => x.name))].sort((a, b) => ((order.indexOf(a) + 1) || 99) - ((order.indexOf(b) + 1) || 99) || a.localeCompare(b));
  return names.map(name => {
    const hits = all.filter(x => x.name === name).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    return { name, n: hits.length, notes: hits.filter(x => x.notes).length, last: hits[0] };
  });
}

const blankSearch = () => ({ q: '', type: 'all', company: '', person: '', from: '', to: '', openId: null });
let ss = blankSearch();
function hl(text, terms) {
  let h = esc(text);
  terms.filter(t => t.length > 1).forEach(t => { h = h.replace(new RegExp('(' + escRe(esc(t)) + ')(?![^<]*>)', 'gi'), '<mark>$1</mark>'); });
  return h;
}

      </div>

function renderResults() {
  const terms = ss.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = db.interactions.filter(it => {
    if (ss.type !== 'all' && it.type !== ss.type) return false;
    if (ss.company && it.companyId !== +ss.company) return false;
    if (ss.person && !it.people.includes(+ss.person) && it.recordedBy !== +ss.person) return false;
    if (ss.from && it.date < ss.from) return false;
    if (ss.to && it.date > ss.to) return false;
    if (terms.length) {
      const hay = [it.desc, it.next, company(it.companyId)?.name, company(it.viaId)?.name, ...it.people.map(id => person(id)?.name)].join(' ').toLowerCase();
      if (!terms.every(t => hay.includes(t))) return false;
    }
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  view.querySelector('#s-count').textContent = `${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}`;
  view.querySelector('#s-results').innerHTML = rows.length ? rows.map(it => {
    const co = it.companyId ? company(it.companyId) : null;
    const acts = db.actions.filter(a => a.interactionId === it.id);
    const ppl = it.people.map(person).filter(Boolean);
    return `<article class="panel ix" id="ix-${it.id}">
      <div class="ix-head"><span class="mono">${fmt(it.date)}</span>${typePill(it.type)}${it.format ? `<span class="muted">${esc(it.format)}</span>` : ''}
        ${co ? coPill(co) : '<span class="muted">General market colour</span>'}
        ${it.viaId && company(it.viaId) ? `<span class="muted">via</span><span class="pill ci">${esc(company(it.viaId).name)}</span>` : ''}
        <span class="muted">Recorded by ${esc(person(it.recordedBy)?.name || 'unknown')}</span></div>
      ${it.review ? `<div class="review-note">Review: ${esc(it.review)}</div>` : ''}
      <p>${hl(it.desc, terms)}</p>
      ${it.next ? `<div class="next"><span class="lbl">Next steps</span><p>${hl(it.next, terms)}</p></div>` : ''}
      ${ppl.length ? `<div class="chips">${ppl.map(p => `<span class="pill ${tcls(company(p.companyId)?.type)}">${hl(p.name, terms)}</span>`).join('')}</div>` : ''}
      ${acts.length ? `<div><span class="lbl">Actions</span><ul class="mini">${acts.map(a => `<li><span class="pill ${a.status === 'Open' ? 'open' : 'done'}">${a.status}</span>${esc(a.desc)}<span class="muted">${esc(person(a.ownerId)?.name || '')}${a.due ? ', due ' + fmt(a.due) : ''}</span></li>`).join('')}</ul></div>` : ''}
    </article>`;
  }).join('') : '<div class="panel empty">No entries match. Try fewer words or clear the filters.</div>';
  if (ss.openId) {
    const el = view.querySelector('#ix-' + ss.openId);
    if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'center' }); }
  }
}

// A web address with https:// added if missing, or '' when it is not a plain web link (so no other kind of link is ever made).
function webLink(s) {
  s = (s || '').trim();
  if (!s) return '';
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  try { const u = new URL(s); return /^https?:$/.test(u.protocol) && u.hostname.includes('.') && !/\s/.test(s) ? s : ''; } catch { return ''; }
}

/* ---------- CI Lead ---------- */
// Who leads an allocator: its Relationship Lead; if none, its Initial Connection; if neither, whoever is on its earliest entry with an introducer.
function ciLeads(allocatorId) {
  const mine = db.pairings.filter(p => p.allocatorId === allocatorId);
  for (const connection of ['Relationship Lead', 'Initial Connection']) {

function wirePairingForm(editing, close) {
  const connections = pairingConnections();
  const err = view.querySelector('#pa-err');

  view.querySelector('#pa-cancel').addEventListener('click', () => close(''));
  view.querySelector('#pa-delete')?.addEventListener('click', () => {

    db.pairings = db.pairings.filter(p => p.id !== editing.id); save(); done('Pairing deleted');
  });
  view.querySelector('#pa-form').addEventListener('submit', e => {

      detail: view.querySelector('#pa-detail').value.trim(), date: view.querySelector('#pa-date').value ? view.querySelector('#pa-date').value + '-01' : '' };
    if (!rec.allocatorId) { err.textContent = 'Choose the allocator.'; return; }
    if (!rec.counterpartyId) { err.textContent = 'Choose the introducer.'; return; }
    if (rec.allocatorId === rec.counterpartyId) { err.textContent = 'Choose two different companies.'; return; }
    if (!rec.connection) { err.textContent = 'Add the connection.'; return; }
    // Reuse the existing spelling, so a filter on the connection finds every row.
    rec.connection = connections.find(c => c.toLowerCase() === rec.connection.toLowerCase()) || rec.connection;
    if (db.pairings.some(p => p.id !== editing.id && p.allocatorId === rec.allocatorId && p.counterpartyId === rec.counterpartyId && p.connection === rec.connection)) { err.textContent = 'That pairing already exists.'; return; }

      return;
    }
    if (editing.id) Object.assign(byId(db.pairings, editing.id), rec); else db.pairings.push({ id: nextId(db.pairings), ...rec });
    save(); done('Pairing saved');
  });
}

/* ---------- Workbook import (runs in this browser only; nothing is uploaded) ---------- */
const str = v => String(v ?? '').trim();
const lc = v => str(v).toLowerCase();
function readSheet(wb, name) {
  const key = wb.SheetNames.find(n => lc(n) === lc(name));
  if (!key) throw new Error(`The workbook has no "${name}" tab. It needs Company, Person, Interaction and Action tabs.`);
  return XLSX.utils.sheet_to_json(wb.Sheets[key], { defval: '', raw: true });
}
function col(row, ...names) {
  for (const n of names) {
    const k = Object.keys(row).find(h => lc(h) === lc(n));
    if (k !== undefined && str(row[k]) !== '') return row[k];
  }
  return '';
}
function xlDate(v) {
  if (v === '' || v == null) return '';
  if (typeof v === 'number') return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = str(v);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const p = new Date(s);

}
function importWorkbook(buf, filename) {
  const wb = XLSX.read(buf, { type: 'array' });
  const warn = [];
  const typeOf = t => COMPANY_TYPES.find(x => lc(x) === lc(t)) || (t ? 'Other' : 'Investor');

  const companies = [];
  readSheet(wb, 'Company').forEach((r, i) => {
    const name = str(col(r, 'Company Name'));
    if (!name) return;
    const t = str(col(r, 'Company Type'));
    if (t && !COMPANY_TYPES.some(x => lc(x) === lc(t))) warn.push(`Company "${name}": type "${t}" not recognised, shown as Other.`);
    companies.push({ id: +col(r, 'Company ID') || 100000 + i, type: typeOf(t), name,
      investorType: str(col(r, 'Investor Type')), investmentType: str(col(r, 'Investment Type')), stage: str(col(r, 'Engagement Stage')) || NO_STAGE, notes: str(col(r, 'Notes')) });
  });
  const coByName = new Map(companies.map(c => [lc(c.name), c]));
  if (!companies.some(c => c.type === 'Demeisen')) warn.push('No company has type Demeisen, so owners and "Recorded by" lists will be empty.');

  const people = [];
  readSheet(wb, 'Person').forEach((r, i) => {
    const name = str(col(r, 'Person Name'));
    if (!name) return;
    const coName = str(col(r, 'Company Name'));
    const co = coByName.get(lc(coName));
    if (!co) { warn.push(`Person "${name}" skipped: company "${coName}" is not on the Company tab.`); return; }
    people.push({ id: +col(r, 'Person ID') || 100000 + i, name, email: str(col(r, 'Person Email')), companyId: co.id,
      title: str(col(r, 'Title', 'Job Title')), phone: str(col(r, 'Phone')), personalEmail: str(col(r, 'Personal Email')), linkedin: webLink(str(col(r, 'LinkedIn'))),
      notes: str(col(r, 'Notes')) });
  });
  const pByName = new Map(people.map(p => [lc(p.name), p]));

  const interactions = [];
  readSheet(wb, 'Interaction').forEach((r, i) => {
    const desc = str(col(r, 'Interaction Desc'));
    const id = +col(r, 'Interaction ID') || 100000 + i;
    if (!desc && !str(col(r, 'Company Name'))) return;
    const coName = str(col(r, 'Company Name'));
    const co = coByName.get(lc(coName));
    if (coName && !co) warn.push(`Interaction ${id}: company "${coName}" is not on the Company tab.`);
    const viaName = str(col(r, 'Via (Prime CI)', 'Via'));
    const via = coByName.get(lc(viaName));
    if (viaName && !via) warn.push(`Interaction ${id}: via "${viaName}" is not on the Company tab.`);
    const ids = [];
    str(col(r, 'People Involved')).split(/[;\n]/).map(s => s.trim()).filter(Boolean).forEach(n => {
      const p = pByName.get(lc(n));
      if (p) { if (!ids.includes(p.id)) ids.push(p.id); } else warn.push(`Interaction ${id}: "${n}" is not on the Person tab.`);
    });
    const rbName = str(col(r, 'Recorded By'));
    const rb = pByName.get(lc(rbName));
    if (rbName && !rb) warn.push(`Interaction ${id}: recorded by "${rbName}" is not on the Person tab.`);
    const date = xlDate(col(r, 'Interaction Date'));
    if (!date) warn.push(`Interaction ${id}: no date.`);
    const lu = col(r, 'Last Updated');
    let upd = '';
    if (typeof lu === 'number') { const u = new Date(Math.round((lu - 25569) * 864e5)); upd = new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes()).toISOString(); }
    interactions.push({ id, type: /intel/i.test(str(col(r, 'Entry Type'))) ? 'Intel' : 'Interaction', date,
      companyId: co ? co.id : null, viaId: via ? via.id : null, format: str(col(r, 'Format')), people: ids,
      recordedBy: rb ? rb.id : null, desc, next: str(col(r, 'Interaction Next Steps')), review: str(col(r, 'Review')),
      ...(upd ? { updated: upd } : {}) });
  });
  const ixIds = new Set(interactions.map(x => x.id));

  const actions = [];
  readSheet(wb, 'Action').forEach((r, i) => {
    const desc = str(col(r, 'Action Desc'));
    if (!desc) return;
    const id = +col(r, 'Action ID') || 100000 + i;
    const ownerName = str(col(r, 'Owner'));
    const owner = pByName.get(lc(ownerName));
    if (ownerName && !owner) warn.push(`Action ${id}: owner "${ownerName}" is not on the Person tab.`);
    let interactionId = +col(r, 'Interaction ID') || null;
    if (interactionId && !ixIds.has(interactionId)) { warn.push(`Action ${id}: interaction ${interactionId} not found.`); interactionId = null; }
    const st = lc(col(r, 'Status'));
    actions.push({ id, desc, due: xlDate(col(r, 'Action Due Date')), ownerId: owner ? owner.id : null, interactionId,
      status: st === 'done' ? 'Done' : st === 'cancelled' || st === 'canceled' ? 'Cancelled' : 'Open', review: str(col(r, 'Review')) });
  });

  // Optional: older workbooks have no pairing tab.
  const pairings = [];
  if (wb.SheetNames.some(n => lc(n) === 'counterparty pairing')) readSheet(wb, 'Counterparty Pairing').forEach((r, i) => {
    const al = coByName.get(lc(col(r, 'Allocator'))), cp = coByName.get(lc(col(r, 'Prime CI'))), connection = str(col(r, 'Connection'));
    if (!al || !cp || !connection) { warn.push(`Pairing on row ${i + 2} skipped: it needs a known allocator, a known introducer and a connection.`); return; }
    pairings.push({ id: +col(r, 'Pairing ID') || 100000 + i, allocatorId: al.id, counterpartyId: cp.id, connection, detail: str(col(r, 'Detail')), date: xlDate(col(r, 'Date')) });
  });

  // Optional: older workbooks have no material tab.
  interactions.forEach(x => { x.materials = []; });
  if (wb.SheetNames.some(n => lc(n) === 'material shared')) readSheet(wb, 'Material Shared').forEach((r, i) => {
    const it = interactions.find(x => x.id === +col(r, 'Interaction ID')), name = str(col(r, 'Material'));
    if (!it || !name) { warn.push(`Material on row ${i + 2} skipped: it needs a known interaction ID and a material.`); return; }
    if (it.materials.some(m => m.name === name)) return;
    it.materials.push({ name, date: xlDate(col(r, 'Date Shared')) || it.date, version: str(col(r, 'Version')) });
  });

  return { companies, people, interactions, actions, pairings,
    meta: { source: filename, loadedAt: new Date().toISOString(), warnings: warn } };
}

function renderStatus() {
  const el = document.getElementById('data-status');
  const m = db.meta;
  if (LIVE) {
    const email = idToken() ? claims(idToken()).email : '';
    el.innerHTML = `<strong>Live database</strong>${db.companies.length} companies, ${db.people.length} people, ${db.interactions.length} entries, ${db.actions.length} actions.${email ? ` Signed in as ${esc(email)}.` : ''}`;
    return;
  }
  if (!m || !m.source) { el.innerHTML = `<strong>Pro-forma</strong>Example data. Import your workbook to load your own; it stays in this browser only.${m?.changes ? ` <span class="unsaved">${m.changes} unsaved change${m.changes > 1 ? 's' : ''}</span>` : ''}`; return; }
  const when = new Date(m.loadedAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  el.innerHTML = `<strong>Your data</strong>Loaded from ${esc(m.source)} on ${when}: ${db.companies.length} companies, ${db.people.length} people, ${db.interactions.length} entries, ${db.actions.length} actions. Stored in this browser only.
    ${m.changes ? `<span class="unsaved">${m.changes} change${m.changes > 1 ? 's' : ''} not yet in a workbook. Use Save workbook.</span>` : m.savedAs ? `<span class="muted">Last saved to ${esc(m.savedAs)}.</span>` : ''}
    ${m.warnings.length ? `<details><summary>${m.warnings.length} item${m.warnings.length > 1 ? 's' : ''} could not be matched</summary><ul>${m.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></details>` : ''}`;
}
document.getElementById('import-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (typeof XLSX === 'undefined') { toast('The spreadsheet reader did not load. Check your connection and reload.'); return; }
  try {
    const next = importWorkbook(await file.arrayBuffer(), file.name);
    if (!next.companies.length) { toast('No companies found on the Company tab.'); return; }
    db = next; ss = blankSearch(); todoOwner = 'all';
    const stored = save(false);
    renderStatus(); route();
    toast(stored ? `Loaded ${db.interactions.length} entries from ${file.name}` : 'Loaded, but this browser would not store it; it will be lost on reload.');
  } catch (err) { toast(err.message || 'That file could not be read.'); }
});
/* ---------- Workbook export: same tabs and headers as the import, so a saved file loads straight back in ---------- */
// Excel date serials written directly, so no time-zone shift can move a date by a day.
const xd = s => s ? Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5 + 25569 : '';
const xdt = s => { if (!s) return ''; const d = new Date(s); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()) / 864e5 + 25569; };
function buildWorkbook() {
  const coName = id => company(id)?.name || '';
  const pName = id => person(id)?.name || '';
  const DATE_FMT = { 'Date Shared': 'dd-mmm-yyyy', 'Interaction Date': 'dd-mmm-yyyy', 'Action Due Date': 'dd-mmm-yyyy', 'Last Updated': 'dd-mmm-yyyy hh:mm', 'Date': 'mmm-yy' };
  const sheet = (rows, widths, header) => {
    const ws = XLSX.utils.json_to_sheet(rows, { header });
    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let c = range.s.c; c <= range.e.c; c++) {
      const z = DATE_FMT[ws[XLSX.utils.encode_cell({ r: 0, c })]?.v];
      if (z) for (let r = 1; r <= range.e.r; r++) { const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (cell && cell.t === 'n') cell.z = z; }
    }
    ws['!cols'] = widths.map(w => ({ wch: w }));
    return ws;
  };
  const sortId = arr => [...arr].sort((a, b) => a.id - b.id);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(sortId(db.companies).map(c => ({ 'Company ID': c.id, 'Company Type': c.type, 'Company Name': c.name,
    'Investor Type': c.investorType || '', 'Investment Type': c.investmentType || '', 'Engagement Stage': c.stage || '', 'Notes': c.notes || '' })), [11, 13, 36, 18, 18, 26, 60]), 'Company');
  XLSX.utils.book_append_sheet(wb, sheet(sortId(db.people).map(p => ({ 'Person ID': p.id, 'Person Name': p.name, 'Person Email': p.email || '',
    'Company Name': coName(p.companyId), 'Title': p.title || '', 'Phone': p.phone || '', 'Personal Email': p.personalEmail || '', 'LinkedIn': p.linkedin || '',
    'Notes': p.notes || '' })), [10, 26, 32, 34, 20, 16, 32, 40, 46]), 'Person');
  XLSX.utils.book_append_sheet(wb, sheet([...db.interactions].sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.id - b.id).map(i => ({
    'Interaction ID': i.id, 'Entry Type': i.type, 'Interaction Date': xd(i.date), 'Company Name': coName(i.companyId), 'Format': i.format || '',
    'Via (Prime CI)': coName(i.viaId), 'People Involved': i.people.map(pName).filter(Boolean).join('; '), 'Interaction Desc': i.desc,
    'Interaction Next Steps': i.next || '', 'Recorded By': pName(i.recordedBy), 'Review': i.review || '',
    'Last Updated': xdt(i.updated), 'People Involved IDs': i.people.join('; '), 'Recorded By ID': i.recordedBy || '' })), [12, 12, 14, 30, 12, 16, 40, 80, 40, 15, 36, 18, 16, 12]), 'Interaction');
  XLSX.utils.book_append_sheet(wb, sheet(sortId(db.actions).map(a => ({ 'Action ID': a.id, 'Action Desc': a.desc, 'Action Due Date': xd(a.due),
    'Status': a.status, 'Owner': pName(a.ownerId), 'Interaction ID': a.interactionId || '',
    'Company': coName(byId(db.interactions, a.interactionId)?.companyId), 'Review': a.review || '', 'Owner ID': a.ownerId || '' })), [10, 62, 15, 10, 15, 13, 30, 40, 10]), 'Action');
  XLSX.utils.book_append_sheet(wb, sheet(sortId(db.pairings).map(p => ({ 'Pairing ID': p.id, 'Allocator': coName(p.allocatorId), 'Prime CI': coName(p.counterpartyId),
    'Connection': p.connection, 'Detail': p.detail || '', 'Date': xd(p.date) })), [10, 36, 36, 30, 36, 10], ['Pairing ID', 'Allocator', 'Prime CI', 'Connection', 'Detail', 'Date']), 'Counterparty Pairing');
  XLSX.utils.book_append_sheet(wb, sheet([...db.interactions].sort((a, b) => a.id - b.id).flatMap(i => (i.materials || []).map(m => ({ 'Interaction ID': i.id,
    'Company': coName(i.companyId), 'Material': m.name, 'Date Shared': xd(m.date), 'Version': m.version || '' }))), [13, 36, 28, 14, 30],
    ['Interaction ID', 'Company', 'Material', 'Date Shared', 'Version']), 'Material Shared');
  return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
}
document.getElementById('export').addEventListener('click', async () => {
  if (typeof XLSX === 'undefined') { toast('The spreadsheet reader did not load. Check your connection and reload.'); return; }
  const name = `Demeisen CRM ${iso(new Date())}.xlsx`;
  const blob = new Blob([buildWorkbook()], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  let savedAs = name;
  try {
    if (window.showSaveFilePicker) {
      // Chrome and Edge: lets you pick the folder and name, or choose an existing workbook to replace.
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Excel workbook', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); savedAs = h.name;
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
  } catch (err) {
    if (err.name === 'AbortError') return;
    toast('This page is not allowed to save files here. Open the copy saved on your computer instead.'); return;
  }
  db.meta = db.meta || { source: '', loadedAt: new Date().toISOString(), warnings: [] };
  db.meta.changes = 0; db.meta.savedAs = savedAs; save(false);
  toast(`Saved ${savedAs}`);
});
const resetBtn = document.getElementById('reset');
let resetArmed = false;
resetBtn.addEventListener('click', () => {
  if (!resetArmed) { resetArmed = true; resetBtn.textContent = 'Click again: replaces loaded data'; setTimeout(() => { resetArmed = false; resetBtn.textContent = 'Reset to example data'; }, 4000); return; }
  db = seed(); save(false); resetArmed = false; resetBtn.textContent = 'Reset to example data'; ss = blankSearch(); renderStatus(); route(); toast('Example data restored');
});
// Demeisen bar (top of the page, the same in every Demeisen app). `apps` in config.js overrides the list,
// in the same order as the other apps; [] shows only this app (a standalone copy of the CRM).
const THIS_APP = { title: 'Investor CRM', url: '#home', current: true };
const APPS = (CFG && CFG.apps) || [THIS_APP];
function renderAppbar() {
  const list = APPS.length ? APPS : [THIS_APP];
  document.getElementById('apps').innerHTML = list.map(a =>
    `<a href="${esc(a.url)}"${a.current ? ' aria-current="true"' : ''}>${esc(a.title)}</a>`).join('');
  const user = document.getElementById('appbar-user'), email = LIVE && idToken() ? claims(idToken()).email : '';
  // russell.hart@x -> Russell Hart (display only)
  const name = email ? email.split('@')[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') : '';
  user.innerHTML = email ? `<span title="${esc(email)}">${esc(name)}</span><button type="button" id="appbar-signout">Sign out</button>` : '';
  if (email) document.getElementById('appbar-signout').addEventListener('click', signOut);
}
renderAppbar();
async function start() {
  if (!LIVE) { renderStatus(); route(); return; }
  document.querySelector('label[for="import-file"]').style.display = 'none'; // imports would not reach the database
  resetBtn.textContent = 'Sign out';
  resetBtn.replaceWith(resetBtn.cloneNode(true));
  document.getElementById('reset').addEventListener('click', signOut);
  document.getElementById('export').textContent = 'Export to Excel';
  view.innerHTML = '<p class="muted">Loading…</p>';
  try {
    await finishSignIn();
    if (!idToken()) { await signIn(); return; }
    await reloadData();
    renderAppbar(); renderStatus(); route();
  } catch (e) { view.innerHTML = `<p class="form-error">${esc(e.message)}</p>`; }
}
start();
</script>
