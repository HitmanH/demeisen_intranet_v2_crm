# Deploys the app (never the data) on every merge to main: app stack, migrations, API code, then the page.
# The AWS role used here can change only the stack demeisen-v2-crm-app and what it owns.
name: Deploy
on:
  push:
    branches: [main]
    paths: ['api/**', 'web/**', 'db/migrations/**', 'infra/**', '!infra/azure/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions: { id-token: write, contents: read }
concurrency: deploy
env:
  AWS_REGION: eu-west-2
  STACK: demeisen-v2-crm-app
  BASE_PATH: /crm/
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test
        working-directory: api
        run: npm ci --no-audit --no-fund && npm test
      - name: Build
        working-directory: api
        run: |
          npm ci --omit=dev --no-audit --no-fund
          curl -fsS "https://truststore.pki.rds.amazonaws.com/$AWS_REGION/$AWS_REGION-bundle.pem" -o rds-ca.pem
          rm -rf migrations && cp -R ../db/migrations migrations
          zip -qr function.zip src node_modules package.json rds-ca.pem migrations
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/demeisen-v2-github-crm-app
          aws-region: ${{ env.AWS_REGION }}
      - name: App stack
        run: |
          aws cloudformation deploy --stack-name "$STACK" --template-file infra/app.yaml --capabilities CAPABILITY_IAM \
            --role-arn "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/demeisen-v2-cfn-exec" \
            --parameter-overrides BasePath="$BASE_PATH" Standalone=false --no-fail-on-empty-changeset
      - name: Migrations (before the code that needs them)
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name demeisen-v2-crm-migrate --zip-file fileb://api/function.zip --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name demeisen-v2-crm-migrate
          aws lambda invoke --function-name demeisen-v2-crm-migrate --cli-binary-format raw-in-base64-out --payload '{"action":"migrate"}' out.json >/dev/null
          cat out.json; echo
          if grep -q '"error"\|errorMessage' out.json; then
            if grep -q "crm_migrator" out.json; then
              echo "::warning::Database not bootstrapped yet: run ops/bootstrap-databases.sh (platform repo, ops/RUNBOOK.md step 6)."
            else
              echo "::error::Migration failed: see the message above. The API code was not updated."; exit 1
            fi
          fi
      - name: API code
        run: |
          aws lambda update-function-code --function-name demeisen-v2-crm-api --zip-file fileb://api/function.zip --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name demeisen-v2-crm-api
      - name: Page
        run: |
          set -euo pipefail
          p() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text; }
          BUCKET=$(p /demeisen/v2/crm/site/bucket); PREFIX="${BASE_PATH#/}"
          cat > config.js <<JS
          window.CRM_CONFIG = { authDomain: '$(p /demeisen/v2/auth/domain)', clientId: '$(p /demeisen/v2/crm/client-id)', basePath: '$BASE_PATH',
            apps: [{ title: 'Intranet', url: '/' }, { title: 'Investor CRM', url: '$BASE_PATH', current: true }] };
          JS
          aws s3 cp web/index.html "s3://$BUCKET/${PREFIX}index.html" --content-type 'text/html; charset=utf-8' --cache-control 'no-cache'
          aws s3 cp config.js "s3://$BUCKET/${PREFIX}config.js" --content-type 'text/javascript; charset=utf-8' --cache-control 'no-cache'
      - name: Check the live site
        run: |
          ORIGIN=$(aws ssm get-parameter --name /demeisen/v2/edge/origin --query Parameter.Value --output text)
          if [ "$ORIGIN" = "https://example.invalid" ]; then echo "Front door not deployed yet; skipping."; exit 0; fi
          page=$(curl -s -o /dev/null -w '%{http_code}' "$ORIGIN${BASE_PATH}"); api=$(curl -s -o /dev/null -w '%{http_code}' "$ORIGIN${BASE_PATH}api/data")
          echo "page $page, api $api (expected 200 and 401)"
          if [ "$page" != 200 ] || [ "$api" != 401 ]; then
            echo "::warning::The front door doesn't serve the CRM yet. Run Deploy in demeisen_intranet_v2_platform once (it adds /crm/), then this check passes."
          fi
