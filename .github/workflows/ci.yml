# Every push and pull request: API tests, the page's script, the templates, the data protections, and every
# migration applied to a real MySQL 8.4.
name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: API tests
        working-directory: api
        run: npm ci --no-audit --no-fund && npm test
      - name: Page script parses
        run: |
          python3 -c "import re;h=open('web/index.html',encoding='utf-8').read();open('/tmp/page.js','w',encoding='utf-8').write(re.findall(r'<script>([\s\S]*?)</script>',h)[-1])"
          node --check /tmp/page.js
      - name: Migrations on MySQL 8.4
        run: node db/test/run-migrations.mjs
      - name: Templates and data protections
        run: |
          pip install -q cfn-lint pyyaml
          cfn-lint data/data.yaml infra/app.yaml
          python3 tools/check-guardrails.py data/data.yaml
